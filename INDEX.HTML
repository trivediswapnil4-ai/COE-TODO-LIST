<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Board</title>
    <link rel="stylesheet" href="STYLE.CSS">
</head>

<body>

    <div class="container">

        <h1>My Board</h1>

        <div class="add-task">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a task..."
            >

            <button id="addBtn">Add</button>
        </div>

        <div class="board">

            <div class="column">
                <h2>To Do</h2>
                <div id="todo" class="task-container"></div>
            </div>

            <div class="column">
                <h2>In Progress</h2>
                <div id="progress" class="task-container"></div>
            </div>

            <div class="column">
                <h2>Done</h2>
                <div id="done" class="task-container"></div>
            </div>

        </div>

    </div>

    <script src="SCRIPT.JS"></script>
</body>
</html>
